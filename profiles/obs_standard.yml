# Profil d'observation hérité de la configuration CyGIL de référence.
# Les dimensions de l'en-tête restent définies par le schéma actuel afin de
# conserver la compatibilité avec les scénarios existants.

obs_size:
  - Columns: 55
    Rows: 101

init_obs_set_item:
  - Column: 0
    Row: 0
  - Column: 35
    Row: 0

obs_wrapper_size:
  - Columns: 2
    Rows: 21

init_obs_wrapper_set_item:
  - Column : 0
    Row: 0
  - Column: 0
    Row: 17

obs_to_obs_wrapper_map:
  wrapper_obs_row:
    # local hand
    # -----------
    - wrapper_obs_row_index: 0
      section: 0
      obs:
      # hand_on_host
      - column: 0
        value: 1
      
      # hand_running_under_privileged_user
      - column: 42
        value: 0

      # hand_running_under_local_or_domain_user
      - column: 43
        value: 0
   


    # local admin hand
    # ---------------
    - wrapper_obs_row_index: 1
      section: 0
      obs:
      # hand_on_host
      - column: 0
        value: 1
      
      # hand_running_under_privileged_user
      - column: 42
        value: 1

      # hand_running_under_local_or_domain_user
      - column: 43
        value: 0


    # domain hand
    # -----------
    - wrapper_obs_row_index: 2
      section: 0
      obs:
      # hand_on_host
      - column: 0
        value: 1
      
      # hand_running_under_privileged_user
      - column: 42
        value: 0
      
      # hand_running_under_local_or_domain_user
      - column: 43
        value: 1


    # domain_admin_hand
    # -----------------  
    - wrapper_obs_row_index: 3
      section: 0
      obs:
      # hand_on_host
      - column: 0
        value: 1

      # hand_running_under_privileged_user
      - column: 42
        value: 1

      # hand_running_under_local_or_domain_user
      - column: 43
        value: 1

        
    # local modifiable service 
    # ------------------------
    - wrapper_obs_row_index: 4
      section: 0
      obs:
      - column: 45
        value: 1
        
    
    # occupied domain controller
    # --------------------------
    - wrapper_obs_row_index: 5
      section: 0
      obs:
      - column: 38
        value: 1

    
    # remote ip found 
    # ----------------
    - wrapper_obs_row_index: 6
      section: 0
      obs:
      # local_ip_discovered_remotely
      - column: 2
        value: 1
      
      # num_remote_ips_found
      - column: 3
        value: 1


    # remote fqdn found
    # -----------------
    - wrapper_obs_row_index: 7
      section: 0
      obs:
      # host_fqdn_identified
      - column: 1
        value: 1

    
    # lsass process
    # -------------
    - wrapper_obs_row_index: 8
      section: 0
      obs:
      # num_lsass_process_found
      - column: 44
        value : 1
    

    # network domain name found
    # -------------------------
    - wrapper_obs_row_index: 9
      section: 1
      obs:
      # num_domain_names_found
      - column: 0
        value: 1
        
    
    # local creds (name&passwd) 
    # ------------------------------
    - wrapper_obs_row_index: 10
      section: 0
      obs:
      # num_local_usernames_found
      - column: 39
        value: 1

      #  num_local_passwords_found
      - column: 41
        value: 1

    
    # local hash
    # ----------------
    - wrapper_obs_row_index: 11
      section: 0
      obs:
      # num_local_usernames_found
      - column: 39
        value: 1

      # num_local_hashes_found
      - column: 41
        value: 1
    

    # domain user creds (name&passwd)
    # --------------------------------
    - wrapper_obs_row_index: 12
      section: 1
      obs:
      # num_domain_username_found
      - column: 1
        value: 1
      
      # num_domain_password_found
      - column: 2
        value: 1
      
      
    # Domain user hash
    # ----------------
    - wrapper_obs_row_index: 13
      section: 1
      obs:
      # num_domain_username_found
      - column: 1
        value: 1
      
      # num_domain_pass_hash_found
      - column: 3
        value: 1

    
    # domain admin name 
    # -----------------
    - wrapper_obs_row_index: 14
      section: 1
      obs:
      # num_domain_username_found
      - column: 4
        value: 1
      
     
    # Domain admin hash
    # ----------------
    - wrapper_obs_row_index: 15
      section: -1
      obs:
      # num_domain_admin_username_found
      - column: 4
        value: 1


    # linux hand
    # -----------
    - wrapper_obs_row_index: 16
      section: 0
      obs:
      # hand_on_host
      - column: 0
        value: 1

      # host_os_linux
      - column: 36
        value: 1
      

    # windows hand
    # ------------
    - wrapper_obs_row_index: 17
      section: 0
      obs:
      # hand_on_host
      - column: 0
        value: 1

      # host_os_windows
      - column: 35
        value: 1


    # antivirus
    # ---------
    - wrapper_obs_row_index: 18
      section: 0
      obs:
      # antivirus_found
      - column: 50
        value: 1
        

    # ssh command used
    # ----------------
    - wrapper_obs_row_index: 19
      section: 0
      obs:
      # num_ssh_commands_found
      - column: 51
        value: 1
    

    # mounted file shares found
    # -------------------------
    - wrapper_obs_row_index: 20
      section: 0
      obs:
      # num_mounted_file_shares_found
      - column: 53
        value: 1
