[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cygil-scenario-orchestrator"
version = "0.2.0"
description = "Prototype Build Out pour définir, valider et compiler des scénarios CyGIL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "nicegui>=3.3,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
cygil-scenario = "cygil_builder.cli:main"
cygil-scenario-gui = "cygil_builder.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
